name: anydrawer
description: >-
  A powerful Flutter drawer that slides from any edge — left, right, top, or bottom.
  No Scaffold required. Supports backdrop blur, drag gestures, return values,
  multiple drawers, swipe-from-edge, and declarative API.
version: 2.0.0
homepage: https://github.com/oi-narendra/anydrawer
topics:
  - drawer
  - navigation
  - panel
  - overlay
  - widget

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=2.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter: null
# To add assets to your package, add an assets section, like this:
# assets:
#   - images/a_dot_burr.jpeg
#   - images/a_dot_ham.jpeg
#

screenshots:
  - description: "Web/tablet grid layout with settings drawer"
    path: screenshots/screenshot_1.png
  - description: "Dialog displayed on top of a drawer"
    path: screenshots/screenshot_2.png
  - description: "Return results from a drawer"
    path: screenshots/screenshot_3.png
  - description: "Drawer settings configuration panel"
    path: screenshots/screenshot_4.png
