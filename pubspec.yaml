name: anydrawer
description: >-
  A powerful Flutter drawer that slides from any edge — left, right, top, or bottom.
  No Scaffold required. Supports backdrop blur, drag gestures, return values,
  multiple drawers, swipe-from-edge, and declarative API.
version: 2.0.0
homepage: https://github.com/oi-narendra/anydrawer
topics:
  - drawer
  - navigation
  - panel
  - overlay
  - widget

environment:
  sdk: ">=3.6.0 <5.0.0"
  flutter: ">=2.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter: null
# To add assets to your package, add an assets section, like this:
# assets:
#   - images/a_dot_burr.jpeg
#   - images/a_dot_ham.jpeg
#

screenshots:
  - description: "Example in mobile"
    path: screenshots/scnsht1.png
  - description: "Examples in Web"
    path: screenshots/scnsht2.png
